<title>Repaso Contratación Mercantil</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--fg:#17202e;--muted:#5b6577;--line:#d9dee7;--accent:#1f4fbf;--bad:#b4322a}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--surface:#182030;--fg:#e7ebf2;--muted:#9aa5b8;--line:#2a3447;--accent:#86a8ff;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.4rem}
p{margin:0;color:var(--muted);font-size:.95rem}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
button{font:600 1rem system-ui,sans-serif;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:var(--bad);min-height:1.4em}
</style>

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Abriendo…"; err.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value.trim()), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:d(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);

    btn.disabled = false; btn.textContent = "Entrar";
